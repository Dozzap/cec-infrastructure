apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: wavelength
spec:
  selector:
    app: mosquitto
  ports:
    - protocol: TCP
      port: 1883
      targetPort: 1883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: wavelength
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
        volumeMounts:
        - name: config-volume
          mountPath: /mosquitto/config
      volumes:
      - name: config-volume
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: wavelength
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversion
  namespace: wavelength
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conversion
  template:
    metadata:
      labels:
        app: conversion
    spec:
      nodeSelector:
        layer: wavelength
      containers:
      - name: conversion
        image: dozzap/workflow_published-conversion:latest
        ports:
        - containerPort: 5000
        env:
        - name: MQTT_BROKER
          value: "mosquitto-service.wavelength"
        - name: MQTT_TOPIC_SUB
          value: "pipeline/speech/out"
        - name: MQTT_TOPIC_PUB
          value: "pipeline/conversion/out"
---
apiVersion: v1
kind: Service
metadata:
  name: conversion-service
  namespace: wavelength
spec:
  type: ClusterIP
  ports:
  - port: 5002
    targetPort: 5000
  selector:
    app: conversion

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profanity
  namespace: wavelength
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profanity
  template:
    metadata:
      labels:
        app: profanity
    spec:
      nodeSelector:
        layer: wavelength
      containers:
      - name: profanity
        image: dozzap/workflow_published-profanity:latest
        ports:
        - containerPort: 5000
        env:
        - name: MQTT_BROKER
          value: "mosquitto-service.wavelength"
        - name: MQTT_TOPIC_SUB
          value: "pipeline/conversion/out"
        - name: MQTT_TOPIC_PUB
          value: "pipeline/profanity/out"
---
apiVersion: v1
kind: Service
metadata:
  name: profanity-service
  namespace: wavelength
spec:
  type: ClusterIP
  ports:
  - port: 5003
    targetPort: 5000
  selector:
    app: profanity

