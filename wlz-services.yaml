# Mosquitto configuration via ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: wavelength
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
---
# Mosquitto Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: wavelength
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
          hostPort: 1883   # Expose on host if needed
        volumeMounts:
        - name: config-volume
          mountPath: /mosquitto/config
      volumes:
      - name: config-volume
        configMap:
          name: mosquitto-config
---
# Conversion Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversion
  namespace: wavelength
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conversion
  template:
    metadata:
      labels:
        app: conversion
    spec:
      nodeSelector:
        layer: wavelength
      containers:
      - name: conversion
        image: dozzap/workflow_published-conversion:latest
        ports:
        - containerPort: 5000
        env:
        - name: MQTT_BROKER
          value: "mosquitto-lb"
        - name: MQTT_TOPIC_SUB
          value: "pipeline/tts/out"
        - name: MQTT_TOPIC_PUB
          value: "pipeline/conversion/out"
---
# Conversion Service
apiVersion: v1
kind: Service
metadata:
  name: conversion-service
  namespace: wavelength
spec:
  type: ClusterIP
  ports:
    - port: 5002
      targetPort: 5000
  selector:
    app: conversion
---
# Profanity Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profanity
  namespace: wavelength
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profanity
  template:
    metadata:
      labels:
        app: profanity
    spec:
      nodeSelector:
        layer: wavelength
      containers:
      - name: profanity
        image: dozzap/workflow_published-profanity:latest
        ports:
        - containerPort: 5000
        env:
        - name: MQTT_BROKER
          value: "mosquitto-lb"
        - name: MQTT_TOPIC_SUB
          value: "pipeline/conversion/out"
        - name: MQTT_TOPIC_PUB
          value: "pipeline/profanity/out"
---
# Profanity Service
apiVersion: v1
kind: Service
metadata:
  name: profanity-service
  namespace: wavelength
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5000
  selector:
    app: profanity
---
# Portainer Deployment: Provides a web UI to monitor/manage Docker containers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: wavelength
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      # Mount the host's Docker socket so that Portainer can monitor it.
      containers:
      - name: portainer
        image: portainer/portainer-ce:latest
        ports:
        - containerPort: 9000
          hostPort: 9000    # Expose Portainer UI on the host
        volumeMounts:
        - name: portainer-data
          mountPath: /data
        - name: docker-socket
          mountPath: /var/run/docker.sock
      volumes:
      - name: portainer-data
        hostPath:
          path: /var/lib/portainer
          type: DirectoryOrCreate
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
---
# Portainer Service: Exposes the Portainer UI externally.
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: wavelength
spec:
  type: NodePort
  ports:
  - port: 9000
    targetPort: 9000
    # NodePort can be adjusted based on your needs; here 30900 is an example.
    nodePort: 30900
  selector:
    app: portainer
