apiVersion: apps/v1
kind: Deployment
metadata:
  name: censor
  namespace: cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: censor
  template:
    metadata:
      labels:
        app: censor
    spec:
      nodeSelector:
        layer: cloud
      containers:
      - name: censor
        image: dozzap/workflow_published-censor:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: censor-service
  namespace: cloud
spec:
  type: LoadBalancer
  ports:
  - port: 5004
    targetPort: 5000
    name: http