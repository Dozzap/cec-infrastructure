version: "3.8"
services:
  text2speech:
    image: dozzap/workflow_published-text2speech:latest
    ports:
      - "5001:5000"  # Exposing container's port 5000 on host port 5001
    environment:
      - MQTT_BROKER=mosquitto-lb   # Set this to the DNS name or IP of your cloud MQTT broker
      - MQTT_PORT=1883             # Standard MQTT port
      - MQTT_TOPIC=pipeline/tts/out
